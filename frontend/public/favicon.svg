<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Subtle rounded tile background -->
  <rect width="32" height="32" rx="8" fill="#167653" />
  
  <!-- Simple Analytics styled triple-bar chart mark in crisp white and soft mint -->
  <!-- Left bar: height 12 -->
  <rect x="7" y="15" width="4" height="10" rx="1.5" fill="#EAF5EE" fill-opacity="0.9" />
  
  <!-- Middle bar (tallest): height 18 -->
  <rect x="14" y="7" width="4" height="18" rx="1.5" fill="#FFFFFF" />
  
  <!-- Right bar: height 14 -->
  <rect x="21" y="11" width="4" height="14" rx="1.5" fill="#EAF5EE" fill-opacity="0.9" />
</svg>