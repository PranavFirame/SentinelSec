services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinelsec-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/sentinelsec.db
      - ALLOW_LOCAL_TARGETS=false
      - MAX_SCAN_TIMEOUT_SECONDS=30
    volumes:
      - sentinelsec-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinelsec-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sentinelsec-data:
