services:
  # FastAPI Backend Service (Free Tier)
  - type: web
    name: sentinelsec-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        # In Render, connect a free PostgreSQL database or use persistent sqlite
        value: "sqlite:///./sentinelsec.db"
      - key: ALLOW_LOCAL_TARGETS
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: SECRET_KEY
        generateValue: true

  # React + Vite Frontend (Static Site - Always Free on Render CDN)
  - type: web
    name: sentinelsec-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        # Must match your Render backend service URL (e.g. https://sentinelsec-backend.onrender.com)
        fromService:
          type: web
          name: sentinelsec-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

